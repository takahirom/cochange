name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base != main) must run CI too.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ChangeUnitTest creates throwaway git repos; give git an identity that
      # works on a bare runner even though the tests also set repo-local config.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Smoke-test the CLI against this repository
        run: |
          ./gradlew installDist -q
          ./build/install/cochange/bin/cochange analyze .
          ./build/install/cochange/bin/cochange detectors

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
