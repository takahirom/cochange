name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build distribution
        run: ./gradlew distTar -PcochangeVersion=${{ github.ref_name }} --stacktrace

      - name: Compute checksum
        id: checksum
        run: |
          TARBALL="build/distributions/cochange-${{ github.ref_name }}.tar.gz"
          SHA=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/takahirom/homebrew-repo.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/cochange.rb <<FORMULA
          class Cochange < Formula
            desc "Find code that changes together but lives apart, from Git history"
            homepage "https://github.com/takahirom/cochange"
            url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cochange-${{ github.ref_name }}.tar.gz"
            sha256 "${{ steps.checksum.outputs.sha256 }}"
            license "Apache-2.0"

            depends_on "openjdk"

            def install
              rm_f Dir["bin/*.bat"]
              libexec.install %w[bin lib]
              env = Language::Java.overridable_java_home_env
              (bin/"cochange").write_env_script libexec/"bin/cochange", env
            end

            test do
              assert_match "cochange", shell_output("#{bin}/cochange --help")
            end
          end
          FORMULA
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cochange.rb
          git commit -m "Update cochange to ${{ github.ref_name }}"
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.checksum.outputs.tarball }}
          fail_on_unmatched_files: true
          body: |
            ## cochange ${{ github.ref_name }}

            Install: `brew install takahirom/repo/cochange`

            The Homebrew formula in `takahirom/homebrew-repo` is updated automatically
            (requires the `HOMEBREW_TAP_TOKEN` secret; manual fallback:
            set `url`/`sha256` in `Formula/cochange.rb` to
            `.../releases/download/${{ github.ref_name }}/cochange-${{ github.ref_name }}.tar.gz`
            and `${{ steps.checksum.outputs.sha256 }}`).
